openapi: 3.0.0
info:
  title: PaTodo API REST
  description: |
    API REST transaccional de PaTodo (Express + TypeScript, desplegada en Render).

    La mayoría de operaciones (lecturas, escrituras simples, autenticación) se
    realizan directamente desde los clientes React y Flutter con los SDKs de
    Firebase (Firebase Auth y Cloud Firestore). Este documento describe
    únicamente las operaciones **críticas** expuestas por la API, que requieren
    lógica de servidor (transacciones, notificaciones, cálculos externos).

    Autenticación: Firebase Auth emite el ID token. Todos los endpoints, salvo
    `GET /` (health check), exigen el header
    `Authorization: Bearer <idToken>`; la API lo verifica con el Admin SDK.

    Roles: cada usuario tiene un rol (`client`, `worker`, `both` o `admin`) que
    se guarda en su documento de `users` y como **Custom Claim** `role` en
    Firebase Auth. Las reglas de seguridad de Firestore (`firestore.rules`) usan
    ese claim para autorizar las escrituras directas del cliente.

    El rol `admin` es un **super usuario**: solo administra el sistema (gestiona
    catálogos `categories`/`skills`, promueve o revoca administradores y revisa
    usuarios), no participa en trabajos. **No se autoconcede**: `POST /createUser`
    lo rechaza. Se asigna únicamente con el script `npm run create-admin` (primer
    admin) o por otro admin vía `POST /admin/makeAdmin`. El claim `admin` viaja
    en el token; tras promover/revocar, el usuario afectado debe refrescar su
    sesión (`getIdToken(true)`).
  version: 0.5.0
servers:
  - url: https://patodo.onrender.com
    description: Producción (Render)
  - url: http://127.0.0.1:3000
    description: Desarrollo local
tags:
  - name: system
    description: Estado del servicio
  - name: users
    description: Registro y gestión de usuarios
  - name: jobs
    description: Operaciones críticas sobre trabajos
  - name: search
    description: Búsquedas (trabajos cercanos por proximidad)
  - name: offers
    description: Aceptación y rechazo de ofertas
  - name: messages
    description: Mensajes entre el cliente y el trabajador asignado
  - name: reviews
    description: Creación de reseñas y actualización de reputación
  - name: routes
    description: Cálculo y almacenamiento de rutas
  - name: payments
    description: Pagos (demo/metodológico, sin dinero real)
  - name: voice
    description: Llamadas de voz entre cliente y trabajador (WebRTC P2P, sin costo por minuto)
  - name: admin
    description: Panel de administración (solo rol `admin`)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
  schemas:
    Error:
      type: object
      description: Formato uniforme de error de la API.
      properties:
        error:
          type: string
          description: Mensaje legible del error.
        code:
          type: string
          description: Código estable para que el cliente lo trate programáticamente.
          enum:
            - invalid-argument
            - unauthenticated
            - permission-denied
            - not-found
            - already-exists
            - failed-precondition
            - resource-exhausted
            - unavailable
            - internal
      required: [error, code]
  responses:
    Unauthenticated:
      description: Falta el token o es inválido/expirado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PermissionDenied:
      description: El usuario autenticado no tiene permisos sobre el recurso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: El recurso no existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidArgument:
      description: Datos inválidos o faltantes en la solicitud.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    FailedPrecondition:
      description: El recurso no está en el estado requerido para la operación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ResourceExhausted:
      description: Se superó el límite de solicitudes (rate limit).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

security:
  - bearerAuth: []

paths:
  # ===================== SISTEMA =====================
  /:
    get:
      tags: [system]
      summary: Health check
      security: []
      responses:
        '200':
          description: El servicio está arriba.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: patodo-api

  # ===================== USUARIOS =====================
  /createUser:
    post:
      tags: [users]
      summary: Crear el perfil del usuario
      description: |
        Crea el documento del usuario en la colección `users` y asigna su rol
        como Custom Claim.

        El flujo es: el cliente registra la cuenta con Firebase Auth (SDK o
        REST), obtiene el `idToken` y luego llama a este endpoint con su `uid`.

        Reglas:
        - `uid` y `email` del body deben coincidir con los del token.
        - El documento no debe existir previamente.

        **Importante:** el Custom Claim viaja en el token, así que el cliente
        debe refrescar su sesión (`getIdToken(true)` o volver a iniciar sesión)
        antes de escribir en Firestore, porque las reglas exigen el claim `role`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                uid:
                  type: string
                  description: UID de Firebase Auth del usuario autenticado.
                email:
                  type: string
                  format: email
                  description: Debe coincidir con el correo de la cuenta de Auth.
                role:
                  type: string
                  enum: [client, worker, both]
                  description: Rol del usuario. `admin` NO es autoasignable; se asigna con `npm run create-admin` o `POST /admin/makeAdmin`.
                profile:
                  type: object
                  properties:
                    firstName:
                      type: string
                    lastName:
                      type: string
                    avatarUrl:
                      type: string
                      nullable: true
                    bio:
                      type: string
                    gender:
                      type: string
                      nullable: true
                    birthdate:
                      type: string
                      nullable: true
                  required: [firstName, lastName]
                contact:
                  type: object
                  properties:
                    phone:
                      type: string
                    alternatePhone:
                      type: string
                      nullable: true
                    address:
                      type: object
                      nullable: true
                      properties:
                        street:
                          type: string
                        city:
                          type: string
                        zip:
                          type: string
                  required: [phone]
              required: [uid, email, role, profile, contact]
      responses:
        '201':
          description: Perfil creado (incluye el `id`, que es el uid).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './schemas/user.json'
                  - type: object
                    properties:
                      id:
                        type: string
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          description: El usuario ya tiene un perfil creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ===================== OFERTAS =====================
  /createOffer:
    post:
      tags: [offers]
      summary: Enviar una propuesta para un trabajo
      description: Solo un trabajador puede enviar una propuesta por trabajo pendiente. La API evita propuestas duplicadas y notifica al cliente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jobId: { type: string }
                price: { type: number, minimum: 0.01 }
                estimatedTime: { type: string }
                note: { type: string }
              required: [jobId, price, estimatedTime]
      responses:
        '201': { description: Propuesta creada. }
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '409': { description: El trabajador ya tiene una propuesta pendiente. }
        '412': { $ref: '#/components/responses/FailedPrecondition' }

  /rejectOffer:
    post:
      tags: [offers]
      summary: Rechazar una propuesta
      description: Solo el cliente dueÃ±o del trabajo puede rechazar una propuesta pendiente. Notifica al trabajador.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jobId: { type: string }
                offerId: { type: string }
              required: [jobId, offerId]
      responses:
        '200': { description: Propuesta rechazada. }
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/FailedPrecondition' }

  # ===================== MENSAJES =====================
  /sendMessage:
    post:
      tags: [messages]
      summary: Enviar un mensaje y avisar al otro participante
      description: |
        Envía un mensaje de texto a una conversación activa. Solo pueden usarlo
        las dos partes del trabajo asociado (cliente y trabajador asignado).
        La API escribe el mensaje, actualiza el resumen de la conversación y
        crea/envía una notificación `new_message` al otro participante para que
        pueda recibir el aviso con la aplicación en segundo plano o cerrada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conversationId, content]
              properties:
                conversationId:
                  type: string
                content:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        '201':
          description: Mensaje creado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  conversationId: { type: string }
                  senderId: { type: string }
                  content: { type: string }
                  type: { type: string, example: text }
                  createdAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/FailedPrecondition' }

  /acceptOffer:
    post:
      tags: [offers]
      summary: Aceptar una oferta (transaccional)
      description: |
        Acepta una oferta específica para un trabajo. En una sola transacción:
        - Actualiza el trabajo a estado `accepted` y asigna `workerId` y `acceptedOfferId`.
        - Marca la oferta aceptada como `accepted` y las demás como `rejected`.
        - Crea la conversación entre cliente y trabajador.
        - Envía notificaciones push al trabajador y a los demás oferentes.

        Solo el cliente dueño del trabajo puede aceptar ofertas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jobId:
                  type: string
                offerId:
                  type: string
              required: [jobId, offerId]
      responses:
        '200':
          description: Oferta aceptada, trabajo actualizado.
          content:
            application/json:
              schema:
                $ref: './schemas/job.json'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/FailedPrecondition'

  # ===================== TRABAJOS =====================
  /jobs/nearby:
    get:
      tags: [search]
      summary: Buscar trabajos cercanos (por geohash y distancia)
      description: |
        Devuelve los trabajos `pending` que están dentro de un radio (en km)
        desde una coordenada. Pensado para el worker: ve los trabajos que le
        quedan cerca junto con la distancia en línea recta.

        Implementación: la búsqueda usa el índice `(status, location.geohash)`
        existente (geohash de 6+ caracteres dentro de `location`) con rango por
        bounding box (geofire-common) y después filtra con haversine para
        descartar las esquinas del recuadro. Los resultados se ordenan por
        distancia (menor primero).
      parameters:
        - in: query
          name: lat
          required: true
          schema:
            type: number
            example: 14.63
          description: Latitud del punto de búsqueda.
        - in: query
          name: lng
          required: true
          schema:
            type: number
            example: -90.51
          description: Longitud del punto de búsqueda.
        - in: query
          name: radiusKm
          schema:
            type: number
            minimum: 0.1
            maximum: 50
            default: 10
            example: 5
          description: Radio de búsqueda en kilómetros.
        - in: query
          name: categoryId
          required: false
          schema:
            type: string
            example: cat-viaje
          description: Filtrar por categoría del trabajo.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
          description: Máximo de trabajos a devolver.
      responses:
        '200':
          description: Trabajos cercanos encontrados, ordenados por distancia.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    description: Trabajos pendientes dentro del radio, ordenados por distancia.
                    items:
                      type: object
                      allOf:
                        - $ref: './schemas/job.json'
                      properties:
                        distanceKm:
                          type: number
                          description: Distancia en línea recta (haversine) desde el punto de búsqueda.
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'

  /cancelJob:
    post:
      tags: [jobs]
      summary: Cancelar un trabajo
      description: |
        Cancela un trabajo y rechaza todas sus ofertas pendientes, cierra la
        conversación activa (si la hay) y notifica a los trabajadores
        involucrados. Solo el cliente dueño puede cancelar y el trabajo no puede
        estar `completed` ni `in_progress`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jobId:
                  type: string
                reason:
                  type: string
              required: [jobId]
      responses:
        '200':
          description: Trabajo cancelado.
          content:
            application/json:
              schema:
                $ref: './schemas/job.json'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/FailedPrecondition'

  /jobs/{jobId}/arrivalCode:
    get:
      tags: [jobs]
      summary: Obtener cÃ³digo de llegada
      description: El cliente dueÃ±o obtiene un cÃ³digo de seis dÃ­gitos cuando el trabajador estÃ¡ cerca del lugar del servicio.
      parameters:
        - in: path
          name: jobId
          required: true
          schema: { type: string }
      responses:
        '200': { description: CÃ³digo de llegada. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/FailedPrecondition' }

  /verifyArrivalCode:
    post:
      tags: [jobs]
      summary: Verificar llegada del trabajador
      description: El trabajador asignado confirma el cÃ³digo a menos de 20 metros del servicio y finaliza el traslado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jobId: { type: string }
                code: { type: string, minLength: 6, maxLength: 6 }
              required: [jobId, code]
      responses:
        '200': { description: Llegada verificada, trabajo completado y vehículo utilizado guardado en el trabajo. }
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/FailedPrecondition' }

  /completeJob:
    post:
      tags: [jobs]
      summary: Marcar un trabajo como completado
      description: |
        El cliente o el trabajador asignado marca el trabajo como `completed`.
        Actualiza la fecha de completado y guarda `vehicleUsed` desde el vehículo
        activo del trabajador, cierra la conversación, incrementa
        `stats.completedJobs`, apaga `availability.isOnline` y notifica a la otra
        parte. Habilita las reseñas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jobId:
                  type: string
              required: [jobId]
      responses:
        '200':
          description: Trabajo completado.
          content:
            application/json:
              schema:
                $ref: './schemas/job.json'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/FailedPrecondition'

  # ===================== RESEÑAS =====================
  /createReview:
    post:
      tags: [reviews]
      summary: Crear una reseña y actualizar reputación
      description: |
        Crea una reseña (una por trabajo y por autor) y actualiza el promedio de
        reputación del usuario calificado en una sola transacción. El trabajo
        debe estar `completed` y el autor debe ser el cliente o el trabajador del
        trabajo. Notifica al usuario calificado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jobId:
                  type: string
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                comment:
                  type: string
              required: [jobId, rating]
      responses:
        '201':
          description: Reseña creada y reputación actualizada.
          content:
            application/json:
              schema:
                $ref: './schemas/review.json'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Ya existe una reseña de este usuario para este trabajo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '412':
          $ref: '#/components/responses/FailedPrecondition'

  # ===================== PAGOS (DEMO) =====================
  /createPayment:
    post:
      tags: [payments]
      summary: Registrar el pago de un trabajo (simulación)
      description: |
        **Módulo demostrativo / metodológico**: no hay pasarela real ni dinero en
        juego. El endpoint simula el resultado final de una pasarela de pagos
        (pago confirmado) y crea:

        - Un documento en la colección `payments` con `isDemo: true`, el monto
          (precio de la oferta aceptada), el método (`demo_card`, `demo_cash` o
          `demo_bank`), una comisión de plataforma (10%) y el pago neto del
          trabajador.
        - El campo `job.payment` con `paymentId`, `status: paid`, monto, método
          y comisión.

        Solo el **cliente dueño** del trabajo puede pagar; el trabajo debe tener
        trabajador asignado (`accepted`, `in_progress` o `completed`) y no estar
        previamente pagado. Crea una notificación `payment_received` al
        trabajador. Diseñado para demostrar el flujo "el cliente paga" antes de
        la reseña.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jobId:
                  type: string
                  description: ID del trabajo a pagar (colección jobs).
                method:
                  type: string
                  enum: [demo_card, demo_cash, demo_bank]
                  description: Método de pago simulado. Por defecto `demo_card`.
              required: [jobId]
      responses:
        '201':
          description: Pago registrado y asociado al trabajo.
          content:
            application/json:
              schema:
                $ref: './schemas/payment.json'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: El trabajo ya fue pagado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '412':
          $ref: '#/components/responses/FailedPrecondition'

  # ===================== VOZ =====================
  /createVoiceSession:
    post:
      tags: [voice]
      summary: Autorizar una llamada de voz y devolver los servidores ICE
      description: |
        Paso previo obligatorio para marcar: el cliente pide permiso para
        llamar y la API responde con lo que la app necesita para iniciar la
        llamada WebRTC. La llamada es de **audio entre el cliente y el
        trabajador de un mismo trabajo**; no hay llamadas a números de
        teléfono (PSTN) ni llamada entre dos clientes o dos trabajadores.

        La API valida y hace lo siguiente:

        - Comprueba que el trabajo existe y está en `accepted` o `in_progress`.
        - Comprueba que quien llama (`callerId`) es el `clientId` **o** el
          `workerId` de ese trabajo, y que quien recibe (`calleeId`) es la
          contraparte. Nadie más puede llamar a ese usuario.
        - Rechaza si hay una llamada activa (`ringing` o `in_progress`) entre
          los dos para ese trabajo.
        - Crea el documento en `calls` con `status: ringing` y
          `direction: outgoing`.
        - Devuelve **credenciales TURN efímeras** (usuario = marca de tiempo de
          expiración, contraseña = HMAC del secreto). El secreto TURN nunca
          sale del servidor: si no está configurado, la respuesta solo incluye
          STUN y la llamada funciona igual mientras haya ruta directa.
        - Crea **una sola** notificación `voice_call_incoming` para el receptor
          y envía el push con `android.priority: high`, porque una llamada
          entrante solo sirve si el teléfono despierta al instante. El `data`
          lleva `type`, `callerName`, `jobId`, `callId` y `direction: incoming`. Es un push
          de datos de prioridad alta (sin bloque `notification`) para que el
          cliente Android pueda mostrar una alerta de llamada a pantalla
          completa, con el dispositivo bloqueado o la app cerrada.

          Del lado del dispositivo (fase D del equipo de desarrollo app, no de la
          API): en Android hay que declarar el permiso
          `USE_FULL_SCREEN_INTENT` y crear el canal de notificación con
          `IMPORTANCE_HIGH`. La API no puede abrir la pantalla; solo entrega los
          datos. Sin esa configuración el push llega pero no abre la llamada, y
          la app no tiene forma de enterarse de que la API ya lo envió.

        **La señalización no pasa por la API.** El cliente escribe la oferta,
        la respuesta y los candidatos ICE directamente en la subcolección
        `calls/{callId}/signals`, cuya escritura permiten las reglas solo a los
        dos participantes. El audio viaja directamente entre dispositivos
        (WebRTC, cifrado DTLS-SRTP) y solo pasa por el relay TURN cuando no hay
        ruta directa. **El audio nunca se almacena.**
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jobId:
                  type: string
                  description: ID del trabajo entre cuyas partes se quiere llamar (colección jobs).
              required: [jobId]
      responses:
        '201':
          description: Sesión autorizada. Devuelve el registro de la llamada y la configuración de conexión.
          content:
            application/json:
              schema:
                type: object
                properties:
                  callId:
                    type: string
                    description: ID del documento creado en la colección calls.
                  jobId:
                    type: string
                    description: ID del trabajo de la llamada.
                  calleeId:
                    type: string
                    description: UID del participante que va a recibir la llamada.
                  direction:
                    type: string
                    enum: [outgoing]
                    description: >-
                      Siempre `outgoing`. Este endpoint lo ejecuta quien marca;
                      quien recibe la llamada deduce que es entrante por ser el
                      `calleeId`.
                  signalingPath:
                    type: string
                    description: Ruta en Firestore donde se escribe la señalización, `calls/{callId}/signals`.
                  iceServers:
                    type: array
                    description: Servidores ICE para el motor WebRTC. Incluye STUN siempre, y TURN si hay credenciales configuradas.
                    items:
                      type: object
                      properties:
                        urls:
                          type: string
                          description: URL del servidor (por ejemplo `turn:turn.patodo.app:3478`).
                        username:
                          type: string
                          description: Usuario. En TURN es una credencial efímera con hora de expiración.
                        credential:
                          type: string
                          description: Contraseña de la credencial efímera.
                      required: [urls]
                  expiresAt:
                    type: string
                    format: date-time
                    description: >-
                      Momento en que expiran las credenciales TURN. Opcional y **ausente**
                      cuando el servidor responde solo con STUN (aún no hay TURN
                      configurado); en ese caso la llamada funciona solo mientras haya
                      ruta directa. Si el TURN está configurado, el cliente debe pedir
                      una sesión nueva cuando expire.
                  call:
                    $ref: './schemas/calls.json'
                required: [callId, jobId, calleeId, direction, signalingPath, iceServers, call]
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            Ya hay una llamada activa entre las dos partes de ese trabajo. La API
            lo garantiza con un cerrojo transaccional (`callLocks/{jobId}`), así
            que dos peticiones simultáneas sobre el mismo trabajo producen
            exactamente un `201` y un `409`, aunque lleguen desde dos pestañas, dos
            dispositivos o por reintento. Si la llamada anterior lleva más de
            `RINGING_TIMEOUT_MS` en `ringing`, se cierra como `missed` y la
            llamada nueva tiene éxito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '412':
          $ref: '#/components/responses/FailedPrecondition'
        '429':
          $ref: '#/components/responses/RateLimited'

  /endVoiceCall:
    post:
      tags: [voice]
      summary: Registrar el desenlace de una llamada de voz
      description: |
        Cierra la llamada: guarda el estado final, la duración y **borra la
        señalización** de `calls/{callId}/signals` (mensajes efímeros que ya
        no sirven). Solo pueden llamarlo las dos partes del trabajo, y solo con
        una transición de estado válida:

        - `ringing` → `in_progress` → `completed` (camino normal)
        - `ringing` → `declined` | `canceled` | `missed`
        - `in_progress` → `completed` | `failed`

        El cliente **no** escribe en `calls` directamente: las reglas de
        Firestore lo prohíben y esta API es la única que valida la transición.

        Qué garantiza esta API y qué no, con claridad: la API **sí** comprueba
        que quien llama sea una de las dos partes del trabajo, que la transición
        sea válida desde el estado actual y que `durationSeconds` sea plausible.
        **No** puede comprobar que la llamada ocurriera de verdad: no ve el audio
        (nunca pasa por el servidor) y la duración y el `mediaRelay` los reporta
        el cliente. Por eso este registro sirve para trazabilidad y métricas, no
        como prueba ni como fuente de facturación.

        ## Quién puede registrar cada desenlace

        - **Quien marca** (`callerId`): `missed` (no contestó a tiempo),
          `canceled` (colgó mientras sonaba) y `completed`.
        - **Quien recibe** (`calleeId`): `declined` (rechazó) y `completed`.
        - **Cualquiera de los dos**: `in_progress` (la llamada se conectó) y
          `failed` (fallo técnico).
        - El estado final se escribe **una sola vez**: después de `completed`,
          `declined`, `canceled`, `missed` o `failed` la llamada es inmutable y
          las siguientes llamadas devuelven `409`.

        ## Llamadas que nadie atiende

        Una llamada abandonada en `ringing` bloquearía nuevas llamadas entre las
        mismas dos personas, porque `createVoiceSession` rechaza con `409` si
        queda una activa. Para que eso no ocurra:

        - Quien marca debe cerrar su propia llamada como `missed` al vencer el
          tiempo de marcado. **No hay tono de ring en el v1**, así que el
          receptor ve la notificación y la pantalla de llamada entrante; el
          `ringing` no expira por sí solo.
        - La API también cierra como `missed` cualquier llamada `ringing` que
          tenga más de `RINGING_TIMEOUT_MS` al evaluarse, para que un cliente que
          se cerró a la mitad no deje el traba bloqueado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                callId:
                  type: string
                  description: ID del documento en la colección calls.
                status:
                  type: string
                  enum: [in_progress, completed, declined, canceled, missed, failed]
                  description: Estado final (o `in_progress` para marcar que la llamada se conectó).
                durationSeconds:
                  type: integer
                  minimum: 0
                  maximum: 14400
                  description: |
                    Duración real en segundos, **reportada por el cliente**.
                    Obligatoria cuando `status` es `completed`. El máximo (4 h)
                    es una salvaguarda contra valores absurdos; la API no puede
                    verificar la duración real, solo que el número sea plausible.
                mediaRelay:
                  type: string
                  enum: [p2p, turn]
                  description: Cómo se transportó el audio. Permite medir si el relay TURN sigue siendo necesario.
                failureCode:
                  type: string
                  description: Motivo técnico, solo si `status` es `failed` (por ejemplo `ice-failed`).
              required: [callId, status]
      responses:
        '200':
          description: Desenlace registrado y señalización eliminada.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './schemas/calls.json'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: La transición de estado no es válida para el estado actual de la llamada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '412':
          $ref: '#/components/responses/FailedPrecondition'

  # ===================== RUTAS =====================
  /computeRoute:
    post:
      tags: [routes]
      summary: Calcular la ruta de un trabajo (distancia y tiempo de llegada)
      description: |
        Calcula la ruta con OSRM y devuelve distancia, duración y geometría.
        Dos modos:

        - **Vista previa (trabajador)**: cualquier trabajador (`role` worker o
          both) puede pedir la ruta desde SU ubicación (`users/{uid}.location`)
          hasta el trabajo, aunque el job todavía esté pendiente (sin
          trabajador asignado). No guarda nada en el job.
        - **Oficial (asignado)**: el cliente o el trabajador asignado puede
          solicitar la ruta, que se persiste en `job.route`.

        Si el job tiene `destination` (servicio de viaje), la ruta incluye dos
        tramos (`legs`): trabajador → punto de recogida (`location`) y punto de
        recogida → destino (`destination`). El trabajador necesita tener su
        ubicación (`users/{uid}.location`) registrada para la vista previa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jobId:
                  type: string
                  description: ID del trabajo (colección jobs).
              required: [jobId]
      responses:
        '200':
          description: Ruta calculada. Incluye `legs` cuando hay destino de viaje.
          content:
            application/json:
              schema:
                type: object
                properties:
                  geometry:
                    type: object
                    description: GeoJSON LineString con las coordenadas de la ruta completa.
                  distance:
                    type: number
                    description: Distancia total en metros.
                  duration:
                    type: number
                    description: Duración total en segundos.
                  source:
                    type: string
                    example: osrm
                  computedAt:
                    type: string
                    format: date-time
                  legs:
                    type: array
                    description: Tramos de la ruta (trabajador→recogida, recogida→destino cuando aplica).
                    items:
                      type: object
                      properties:
                        from:
                          type: object
                          properties:
                            latitude: { type: number }
                            longitude: { type: number }
                        to:
                          type: object
                          properties:
                            latitude: { type: number }
                            longitude: { type: number }
                        distance:
                          type: number
                          description: Distancia del tramo en metros.
                        duration:
                          type: number
                          description: Duración del tramo en segundos.
                  persisted:
                    type: boolean
                    description: true si la ruta se guardó en job.route (modo oficial), false si fue solo vista previa.
                  preview:
                    type: boolean
                    description: true si fue una vista previa de trabajador no asignado.
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/FailedPrecondition'
        '503':
          description: El servicio de rutas (OSRM) no está disponible o está saturado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ===================== ADMIN =====================
  /admin/makeAdmin:
    post:
      tags: [admin]
      summary: Promover un usuario a administrador
      description: |
        Asigna el rol `admin` a un usuario existente: actualiza su documento
        `users/{uid}.role` y publica el Custom Claim `role: admin`.

        Solo un usuario con rol `admin` puede llamar este endpoint. El admin
        promovido debe refrescar su token (`getIdToken(true)`) para que el claim
        viaje en su ID token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                uid:
                  type: string
                  description: UID del usuario que será promovido a admin.
              required: [uid]
      responses:
        '200':
          description: Usuario promovido a administrador.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: UID del usuario promovido.
                  role:
                    type: string
                    example: admin
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/removeAdmin:
    post:
      tags: [admin]
      summary: Revocar el rol administrador de un usuario
      description: |
        Convierte a un usuario `admin` de vuelta en un usuario con rol `client`.
        Actualiza `users/{uid}.role` y el Custom Claim `role`.

        Solo un usuario con rol `admin` puede llamar este endpoint. No se permite
        revocarse a sí mismo. El usuario rebajado debe refrescar su token
        (`getIdToken(true)`) para que el claim viaje en su ID token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                uid:
                  type: string
                  description: UID del administrador al que se le revocará el rol.
              required: [uid]
      responses:
        '200':
          description: Rol de administrador revocado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: UID del usuario rebajado.
                  role:
                    type: string
                    example: client
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

