openapi: 3.0.0
info:
  title: PaTodo API REST
  description: |
    API REST transaccional de PaTodo (Express + TypeScript, desplegada en Render).

    La mayoría de operaciones (lecturas, escrituras simples, autenticación) se
    realizan directamente desde los clientes React y Flutter con los SDKs de
    Firebase (Firebase Auth y Cloud Firestore). Este documento describe
    únicamente las operaciones **críticas** expuestas por la API, que requieren
    lógica de servidor (transacciones, notificaciones, cálculos externos).

    Autenticación: Firebase Auth emite el ID token. Todos los endpoints, salvo
    `GET /` (health check), exigen el header
    `Authorization: Bearer <idToken>`; la API lo verifica con el Admin SDK.

    Roles: cada usuario tiene un rol (`client`, `worker` o `both`) que se guarda
    en su documento de `users` y como **Custom Claim** `role` en Firebase Auth.
    Las reglas de seguridad de Firestore (`firestore.rules`) usan ese claim para
    autorizar las escrituras directas del cliente.
  version: 0.4.0
servers:
  - url: https://patodo.onrender.com
    description: Producción (Render)
  - url: http://127.0.0.1:3000
    description: Desarrollo local
tags:
  - name: system
    description: Estado del servicio
  - name: users
    description: Registro y gestión de usuarios
  - name: jobs
    description: Operaciones críticas sobre trabajos
  - name: search
    description: Búsquedas (trabajos cercanos por proximidad)
  - name: offers
    description: Aceptación y rechazo de ofertas
  - name: reviews
    description: Creación de reseñas y actualización de reputación
  - name: routes
    description: Cálculo y almacenamiento de rutas

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
  schemas:
    Error:
      type: object
      description: Formato uniforme de error de la API.
      properties:
        error:
          type: string
          description: Mensaje legible del error.
        code:
          type: string
          description: Código estable para que el cliente lo trate programáticamente.
          enum:
            - invalid-argument
            - unauthenticated
            - permission-denied
            - not-found
            - already-exists
            - failed-precondition
            - resource-exhausted
            - unavailable
            - internal
      required: [error, code]
  responses:
    Unauthenticated:
      description: Falta el token o es inválido/expirado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PermissionDenied:
      description: El usuario autenticado no tiene permisos sobre el recurso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: El recurso no existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidArgument:
      description: Datos inválidos o faltantes en la solicitud.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    FailedPrecondition:
      description: El recurso no está en el estado requerido para la operación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ResourceExhausted:
      description: Se superó el límite de solicitudes (rate limit).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

security:
  - bearerAuth: []

paths:
  # ===================== SISTEMA =====================
  /:
    get:
      tags: [system]
      summary: Health check
      security: []
      responses:
        '200':
          description: El servicio está arriba.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: patodo-api

  # ===================== USUARIOS =====================
  /createUser:
    post:
      tags: [users]
      summary: Crear el perfil del usuario
      description: |
        Crea el documento del usuario en la colección `users` y asigna su rol
        como Custom Claim.

        El flujo es: el cliente registra la cuenta con Firebase Auth (SDK o
        REST), obtiene el `idToken` y luego llama a este endpoint con su `uid`.

        Reglas:
        - `uid` y `email` del body deben coincidir con los del token.
        - El documento no debe existir previamente.

        **Importante:** el Custom Claim viaja en el token, así que el cliente
        debe refrescar su sesión (`getIdToken(true)` o volver a iniciar sesión)
        antes de escribir en Firestore, porque las reglas exigen el claim `role`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                uid:
                  type: string
                  description: UID de Firebase Auth del usuario autenticado.
                email:
                  type: string
                  format: email
                  description: Debe coincidir con el correo de la cuenta de Auth.
                role:
                  type: string
                  enum: [client, worker, both]
                profile:
                  type: object
                  properties:
                    firstName:
                      type: string
                    lastName:
                      type: string
                    avatarUrl:
                      type: string
                      nullable: true
                    bio:
                      type: string
                    gender:
                      type: string
                      nullable: true
                    birthdate:
                      type: string
                      nullable: true
                  required: [firstName, lastName]
                contact:
                  type: object
                  properties:
                    phone:
                      type: string
                    alternatePhone:
                      type: string
                      nullable: true
                    address:
                      type: object
                      nullable: true
                      properties:
                        street:
                          type: string
                        city:
                          type: string
                        zip:
                          type: string
                  required: [phone]
              required: [uid, email, role, profile, contact]
      responses:
        '201':
          description: Perfil creado (incluye el `id`, que es el uid).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './schemas/user.json'
                  - type: object
                    properties:
                      id:
                        type: string
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          description: El usuario ya tiene un perfil creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ===================== OFERTAS =====================
  /acceptOffer:
    post:
      tags: [offers]
      summary: Aceptar una oferta (transaccional)
      description: |
        Acepta una oferta específica para un trabajo. En una sola transacción:
        - Actualiza el trabajo a estado `accepted` y asigna `workerId` y `acceptedOfferId`.
        - Marca la oferta aceptada como `accepted` y las demás como `rejected`.
        - Crea la conversación entre cliente y trabajador.
        - Envía notificaciones push al trabajador y a los demás oferentes.

        Solo el cliente dueño del trabajo puede aceptar ofertas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jobId:
                  type: string
                offerId:
                  type: string
              required: [jobId, offerId]
      responses:
        '200':
          description: Oferta aceptada, trabajo actualizado.
          content:
            application/json:
              schema:
                $ref: './schemas/job.json'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/FailedPrecondition'

  # ===================== TRABAJOS =====================
  /jobs/nearby:
    get:
      tags: [search]
      summary: Buscar trabajos cercanos (por geohash y distancia)
      description: |
        Devuelve los trabajos `pending` que están dentro de un radio (en km)
        desde una coordenada. Pensado para el worker: ve los trabajos que le
        quedan cerca junto con la distancia en línea recta.

        Implementación: la búsqueda usa el índice `(status, location.geohash)`
        existente (geohash de 6+ caracteres dentro de `location`) con rango por
        bounding box (geofire-common) y después filtra con haversine para
        descartar las esquinas del recuadro. Los resultados se ordenan por
        distancia (menor primero).
      parameters:
        - in: query
          name: lat
          required: true
          schema:
            type: number
            example: 14.63
          description: Latitud del punto de búsqueda.
        - in: query
          name: lng
          required: true
          schema:
            type: number
            example: -90.51
          description: Longitud del punto de búsqueda.
        - in: query
          name: radiusKm
          schema:
            type: number
            minimum: 0.1
            maximum: 50
            default: 10
            example: 5
          description: Radio de búsqueda en kilómetros.
        - in: query
          name: categoryId
          required: false
          schema:
            type: string
            example: cat-viaje
          description: Filtrar por categoría del trabajo.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
          description: Máximo de trabajos a devolver.
      responses:
        '200':
          description: Trabajos cercanos encontrados, ordenados por distancia.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    description: Trabajos pendientes dentro del radio, ordenados por distancia.
                    items:
                      type: object
                      allOf:
                        - $ref: './schemas/job.json'
                      properties:
                        distanceKm:
                          type: number
                          description: Distancia en línea recta (haversine) desde el punto de búsqueda.
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'

  /cancelJob:
    post:
      tags: [jobs]
      summary: Cancelar un trabajo
      description: |
        Cancela un trabajo y rechaza todas sus ofertas pendientes, cierra la
        conversación activa (si la hay) y notifica a los trabajadores
        involucrados. Solo el cliente dueño puede cancelar y el trabajo no puede
        estar `completed` ni `in_progress`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jobId:
                  type: string
                reason:
                  type: string
              required: [jobId]
      responses:
        '200':
          description: Trabajo cancelado.
          content:
            application/json:
              schema:
                $ref: './schemas/job.json'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/FailedPrecondition'

  /completeJob:
    post:
      tags: [jobs]
      summary: Marcar un trabajo como completado
      description: |
        El cliente o el trabajador asignado marca el trabajo como `completed`.
        Actualiza la fecha de completado, cierra la conversación, incrementa
        `stats.completedJobs` del trabajador, apaga su `availability.isOnline` y
        notifica a la otra parte. Habilita las reseñas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jobId:
                  type: string
              required: [jobId]
      responses:
        '200':
          description: Trabajo completado.
          content:
            application/json:
              schema:
                $ref: './schemas/job.json'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/FailedPrecondition'

  # ===================== RESEÑAS =====================
  /createReview:
    post:
      tags: [reviews]
      summary: Crear una reseña y actualizar reputación
      description: |
        Crea una reseña (una por trabajo y por autor) y actualiza el promedio de
        reputación del usuario calificado en una sola transacción. El trabajo
        debe estar `completed` y el autor debe ser el cliente o el trabajador del
        trabajo. Notifica al usuario calificado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jobId:
                  type: string
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                comment:
                  type: string
              required: [jobId, rating]
      responses:
        '201':
          description: Reseña creada y reputación actualizada.
          content:
            application/json:
              schema:
                $ref: './schemas/review.json'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Ya existe una reseña de este usuario para este trabajo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '412':
          $ref: '#/components/responses/FailedPrecondition'

  # ===================== RUTAS =====================
  /computeRoute:
    post:
      tags: [routes]
      summary: Calcular la ruta de un trabajo (distancia y tiempo de llegada)
      description: |
        Calcula la ruta con OSRM y devuelve distancia, duración y geometría.
        Dos modos:

        - **Vista previa (trabajador)**: cualquier trabajador (`role` worker o
          both) puede pedir la ruta desde SU ubicación (`users/{uid}.location`)
          hasta el trabajo, aunque el job todavía esté pendiente (sin
          trabajador asignado). No guarda nada en el job.
        - **Oficial (asignado)**: el cliente o el trabajador asignado puede
          solicitar la ruta, que se persiste en `job.route`.

        Si el job tiene `destination` (servicio de viaje), la ruta incluye dos
        tramos (`legs`): trabajador → punto de recogida (`location`) y punto de
        recogida → destino (`destination`). El trabajador necesita tener su
        ubicación (`users/{uid}.location`) registrada para la vista previa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jobId:
                  type: string
                  description: ID del trabajo (colección jobs).
              required: [jobId]
      responses:
        '200':
          description: Ruta calculada. Incluye `legs` cuando hay destino de viaje.
          content:
            application/json:
              schema:
                type: object
                properties:
                  geometry:
                    type: object
                    description: GeoJSON LineString con las coordenadas de la ruta completa.
                  distance:
                    type: number
                    description: Distancia total en metros.
                  duration:
                    type: number
                    description: Duración total en segundos.
                  source:
                    type: string
                    example: osrm
                  computedAt:
                    type: string
                    format: date-time
                  legs:
                    type: array
                    description: Tramos de la ruta (trabajador→recogida, recogida→destino cuando aplica).
                    items:
                      type: object
                      properties:
                        from:
                          type: object
                          properties:
                            latitude: { type: number }
                            longitude: { type: number }
                        to:
                          type: object
                          properties:
                            latitude: { type: number }
                            longitude: { type: number }
                        distance:
                          type: number
                          description: Distancia del tramo en metros.
                        duration:
                          type: number
                          description: Duración del tramo en segundos.
                  persisted:
                    type: boolean
                    description: true si la ruta se guardó en job.route (modo oficial), false si fue solo vista previa.
                  preview:
                    type: boolean
                    description: true si fue una vista previa de trabajador no asignado.
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/FailedPrecondition'
        '503':
          description: El servicio de rutas (OSRM) no está disponible o está saturado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
