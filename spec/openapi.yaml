openapi: 3.0.0
info:
  title: PaTodo API REST
  description: |
    API REST transaccional de PaTodo (Express + TypeScript, desplegada en Render).

    La mayoría de operaciones (lecturas, escrituras simples, autenticación) se
    realizan directamente desde los clientes React y Flutter con los SDKs de
    Firebase (Firebase Auth y Cloud Firestore). Este documento describe
    únicamente las operaciones **críticas** expuestas por la API, que requieren
    lógica de servidor (transacciones, notificaciones, cálculos externos).

    Autenticación: Firebase Auth emite el ID token. Todos los endpoints, salvo
    `GET /` (health check), exigen el header
    `Authorization: Bearer <idToken>`; la API lo verifica con el Admin SDK.

    Roles: cada usuario tiene un rol (`client`, `worker`, `both` o `admin`) que
    se guarda en su documento de `users` y como **Custom Claim** `role` en
    Firebase Auth. Las reglas de seguridad de Firestore (`firestore.rules`) usan
    ese claim para autorizar las escrituras directas del cliente.

    El rol `admin` es un **super usuario**: solo administra el sistema (gestiona
    catálogos `categories`/`skills`, promueve o revoca administradores y revisa
    usuarios), no participa en trabajos. **No se autoconcede**: `POST /createUser`
    lo rechaza. Se asigna únicamente con el script `npm run create-admin` (primer
    admin) o por otro admin vía `POST /admin/makeAdmin`. El claim `admin` viaja
    en el token; tras promover/revocar, el usuario afectado debe refrescar su
    sesión (`getIdToken(true)`).
  version: 0.5.0
servers:
  - url: https://patodo.onrender.com
    description: Producción (Render)
  - url: http://127.0.0.1:3000
    description: Desarrollo local
tags:
  - name: system
    description: Estado del servicio
  - name: users
    description: Registro y gestión de usuarios
  - name: jobs
    description: Operaciones críticas sobre trabajos
  - name: search
    description: Búsquedas (trabajos cercanos por proximidad)
  - name: offers
    description: Aceptación y rechazo de ofertas
  - name: reviews
    description: Creación de reseñas y actualización de reputación
  - name: routes
    description: Cálculo y almacenamiento de rutas
  - name: admin
    description: Panel de administración (solo rol `admin`)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
  schemas:
    Error:
      type: object
      description: Formato uniforme de error de la API.
      properties:
        error:
          type: string
          description: Mensaje legible del error.
        code:
          type: string
          description: Código estable para que el cliente lo trate programáticamente.
          enum:
            - invalid-argument
            - unauthenticated
            - permission-denied
            - not-found
            - already-exists
            - failed-precondition
            - resource-exhausted
            - unavailable
            - internal
      required: [error, code]
  responses:
    Unauthenticated:
      description: Falta el token o es inválido/expirado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PermissionDenied:
      description: El usuario autenticado no tiene permisos sobre el recurso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: El recurso no existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidArgument:
      description: Datos inválidos o faltantes en la solicitud.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    FailedPrecondition:
      description: El recurso no está en el estado requerido para la operación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ResourceExhausted:
      description: Se superó el límite de solicitudes (rate limit).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

security:
  - bearerAuth: []

paths:
  # ===================== SISTEMA =====================
  /:
    get:
      tags: [system]
      summary: Health check
      security: []
      responses:
        '200':
          description: El servicio está arriba.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: patodo-api

  # ===================== USUARIOS =====================
  /createUser:
    post:
      tags: [users]
      summary: Crear el perfil del usuario
      description: |
        Crea el documento del usuario en la colección `users` y asigna su rol
        como Custom Claim.

        El flujo es: el cliente registra la cuenta con Firebase Auth (SDK o
        REST), obtiene el `idToken` y luego llama a este endpoint con su `uid`.

        Reglas:
        - `uid` y `email` del body deben coincidir con los del token.
        - El documento no debe existir previamente.

        **Importante:** el Custom Claim viaja en el token, así que el cliente
        debe refrescar su sesión (`getIdToken(true)` o volver a iniciar sesión)
        antes de escribir en Firestore, porque las reglas exigen el claim `role`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                uid:
                  type: string
                  description: UID de Firebase Auth del usuario autenticado.
                email:
                  type: string
                  format: email
                  description: Debe coincidir con el correo de la cuenta de Auth.
                role:
                  type: string
                  enum: [client, worker, both]
                  description: Rol del usuario. `admin` NO es autoasignable; se asigna con `npm run create-admin` o `POST /admin/makeAdmin`.
                profile:
                  type: object
                  properties:
                    firstName:
                      type: string
                    lastName:
                      type: string
                    avatarUrl:
                      type: string
                      nullable: true
                    bio:
                      type: string
                    gender:
                      type: string
                      nullable: true
                    birthdate:
                      type: string
                      nullable: true
                  required: [firstName, lastName]
                contact:
                  type: object
                  properties:
                    phone:
                      type: string
                    alternatePhone:
                      type: string
                      nullable: true
                    address:
                      type: object
                      nullable: true
                      properties:
                        street:
                          type: string
                        city:
                          type: string
                        zip:
                          type: string
                  required: [phone]
              required: [uid, email, role, profile, contact]
      responses:
        '201':
          description: Perfil creado (incluye el `id`, que es el uid).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './schemas/user.json'
                  - type: object
                    properties:
                      id:
                        type: string
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          description: El usuario ya tiene un perfil creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ===================== OFERTAS =====================
  /acceptOffer:
    post:
      tags: [offers]
      summary: Aceptar una oferta (transaccional)
      description: |
        Acepta una oferta específica para un trabajo. En una sola transacción:
        - Actualiza el trabajo a estado `accepted` y asigna `workerId` y `acceptedOfferId`.
        - Marca la oferta aceptada como `accepted` y las demás como `rejected`.
        - Crea la conversación entre cliente y trabajador.
        - Envía notificaciones push al trabajador y a los demás oferentes.

        Solo el cliente dueño del trabajo puede aceptar ofertas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jobId:
                  type: string
                offerId:
                  type: string
              required: [jobId, offerId]
      responses:
        '200':
          description: Oferta aceptada, trabajo actualizado.
          content:
            application/json:
              schema:
                $ref: './schemas/job.json'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/FailedPrecondition'

  # ===================== TRABAJOS =====================
  /jobs/nearby:
    get:
      tags: [search]
      summary: Buscar trabajos cercanos (por geohash y distancia)
      description: |
        Devuelve los trabajos `pending` que están dentro de un radio (en km)
        desde una coordenada. Pensado para el worker: ve los trabajos que le
        quedan cerca junto con la distancia en línea recta.

        Implementación: la búsqueda usa el índice `(status, location.geohash)`
        existente (geohash de 6+ caracteres dentro de `location`) con rango por
        bounding box (geofire-common) y después filtra con haversine para
        descartar las esquinas del recuadro. Los resultados se ordenan por
        distancia (menor primero).
      parameters:
        - in: query
          name: lat
          required: true
          schema:
            type: number
            example: 14.63
          description: Latitud del punto de búsqueda.
        - in: query
          name: lng
          required: true
          schema:
            type: number
            example: -90.51
          description: Longitud del punto de búsqueda.
        - in: query
          name: radiusKm
          schema:
            type: number
            minimum: 0.1
            maximum: 50
            default: 10
            example: 5
          description: Radio de búsqueda en kilómetros.
        - in: query
          name: categoryId
          required: false
          schema:
            type: string
            example: cat-viaje
          description: Filtrar por categoría del trabajo.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
          description: Máximo de trabajos a devolver.
      responses:
        '200':
          description: Trabajos cercanos encontrados, ordenados por distancia.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    description: Trabajos pendientes dentro del radio, ordenados por distancia.
                    items:
                      type: object
                      allOf:
                        - $ref: './schemas/job.json'
                      properties:
                        distanceKm:
                          type: number
                          description: Distancia en línea recta (haversine) desde el punto de búsqueda.
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'

  /cancelJob:
    post:
      tags: [jobs]
      summary: Cancelar un trabajo
      description: |
        Cancela un trabajo y rechaza todas sus ofertas pendientes, cierra la
        conversación activa (si la hay) y notifica a los trabajadores
        involucrados. Solo el cliente dueño puede cancelar y el trabajo no puede
        estar `completed` ni `in_progress`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jobId:
                  type: string
                reason:
                  type: string
              required: [jobId]
      responses:
        '200':
          description: Trabajo cancelado.
          content:
            application/json:
              schema:
                $ref: './schemas/job.json'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/FailedPrecondition'

  /completeJob:
    post:
      tags: [jobs]
      summary: Marcar un trabajo como completado
      description: |
        El cliente o el trabajador asignado marca el trabajo como `completed`.
        Actualiza la fecha de completado, cierra la conversación, incrementa
        `stats.completedJobs` del trabajador, apaga su `availability.isOnline` y
        notifica a la otra parte. Habilita las reseñas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jobId:
                  type: string
              required: [jobId]
      responses:
        '200':
          description: Trabajo completado.
          content:
            application/json:
              schema:
                $ref: './schemas/job.json'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/FailedPrecondition'

  # ===================== RESEÑAS =====================
  /createReview:
    post:
      tags: [reviews]
      summary: Crear una reseña y actualizar reputación
      description: |
        Crea una reseña (una por trabajo y por autor) y actualiza el promedio de
        reputación del usuario calificado en una sola transacción. El trabajo
        debe estar `completed` y el autor debe ser el cliente o el trabajador del
        trabajo. Notifica al usuario calificado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jobId:
                  type: string
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                comment:
                  type: string
              required: [jobId, rating]
      responses:
        '201':
          description: Reseña creada y reputación actualizada.
          content:
            application/json:
              schema:
                $ref: './schemas/review.json'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Ya existe una reseña de este usuario para este trabajo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '412':
          $ref: '#/components/responses/FailedPrecondition'

  # ===================== RUTAS =====================
  /computeRoute:
    post:
      tags: [routes]
      summary: Calcular la ruta de un trabajo (distancia y tiempo de llegada)
      description: |
        Calcula la ruta con OSRM y devuelve distancia, duración y geometría.
        Dos modos:

        - **Vista previa (trabajador)**: cualquier trabajador (`role` worker o
          both) puede pedir la ruta desde SU ubicación (`users/{uid}.location`)
          hasta el trabajo, aunque el job todavía esté pendiente (sin
          trabajador asignado). No guarda nada en el job.
        - **Oficial (asignado)**: el cliente o el trabajador asignado puede
          solicitar la ruta, que se persiste en `job.route`.

        Si el job tiene `destination` (servicio de viaje), la ruta incluye dos
        tramos (`legs`): trabajador → punto de recogida (`location`) y punto de
        recogida → destino (`destination`). El trabajador necesita tener su
        ubicación (`users/{uid}.location`) registrada para la vista previa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jobId:
                  type: string
                  description: ID del trabajo (colección jobs).
              required: [jobId]
      responses:
        '200':
          description: Ruta calculada. Incluye `legs` cuando hay destino de viaje.
          content:
            application/json:
              schema:
                type: object
                properties:
                  geometry:
                    type: object
                    description: GeoJSON LineString con las coordenadas de la ruta completa.
                  distance:
                    type: number
                    description: Distancia total en metros.
                  duration:
                    type: number
                    description: Duración total en segundos.
                  source:
                    type: string
                    example: osrm
                  computedAt:
                    type: string
                    format: date-time
                  legs:
                    type: array
                    description: Tramos de la ruta (trabajador→recogida, recogida→destino cuando aplica).
                    items:
                      type: object
                      properties:
                        from:
                          type: object
                          properties:
                            latitude: { type: number }
                            longitude: { type: number }
                        to:
                          type: object
                          properties:
                            latitude: { type: number }
                            longitude: { type: number }
                        distance:
                          type: number
                          description: Distancia del tramo en metros.
                        duration:
                          type: number
                          description: Duración del tramo en segundos.
                  persisted:
                    type: boolean
                    description: true si la ruta se guardó en job.route (modo oficial), false si fue solo vista previa.
                  preview:
                    type: boolean
                    description: true si fue una vista previa de trabajador no asignado.
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/FailedPrecondition'
        '503':
          description: El servicio de rutas (OSRM) no está disponible o está saturado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ===================== ADMIN =====================
  /admin/makeAdmin:
    post:
      tags: [admin]
      summary: Promover un usuario a administrador
      description: |
        Asigna el rol `admin` a un usuario existente: actualiza su documento
        `users/{uid}.role` y publica el Custom Claim `role: admin`.

        Solo un usuario con rol `admin` puede llamar este endpoint. El admin
        promovido debe refrescar su token (`getIdToken(true)`) para que el claim
        viaje en su ID token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                uid:
                  type: string
                  description: UID del usuario que será promovido a admin.
              required: [uid]
      responses:
        '200':
          description: Usuario promovido a administrador.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: UID del usuario promovido.
                  role:
                    type: string
                    example: admin
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/removeAdmin:
    post:
      tags: [admin]
      summary: Revocar el rol administrador de un usuario
      description: |
        Convierte a un usuario `admin` de vuelta en un usuario con rol `client`.
        Actualiza `users/{uid}.role` y el Custom Claim `role`.

        Solo un usuario con rol `admin` puede llamar este endpoint. No se permite
        revocarse a sí mismo. El usuario rebajado debe refrescar su token
        (`getIdToken(true)`) para que el claim viaje en su ID token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                uid:
                  type: string
                  description: UID del administrador al que se le revocará el rol.
              required: [uid]
      responses:
        '200':
          description: Rol de administrador revocado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: UID del usuario rebajado.
                  role:
                    type: string
                    example: client
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/stats:
    get:
      tags: [admin]
      summary: Estadísticas del panel de administración
      description: |
        Devuelve un resumen agregado de la plataforma para el dashboard admin:
        conteos de usuarios por rol, trabajos por estado, ofertas, calificación
        promedio y actividad reciente (usuarios/trabajos nuevos esta semana).

        Solo un usuario con rol `admin` puede llamar este endpoint.
      responses:
        '200':
          description: Estadísticas agregadas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalUsers:
                    type: integer
                  totalClients:
                    type: integer
                  totalWorkers:
                    type: integer
                  totalAdmins:
                    type: integer
                  totalJobs:
                    type: integer
                  activeJobs:
                    type: integer
                  pendingJobs:
                    type: integer
                  completedJobs:
                    type: integer
                  cancelledJobs:
                    type: integer
                  totalOffers:
                    type: integer
                  pendingOffers:
                    type: integer
                  acceptedOffers:
                    type: integer
                  averageRating:
                    type: number
                  totalRevenue:
                    type: number
                  currency:
                    type: string
                    example: GTQ
                  activeUsersToday:
                    type: integer
                  newUsersThisWeek:
                    type: integer
                  newJobsThisWeek:
                    type: integer
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'

  /admin/users:
    get:
      tags: [admin]
      summary: Listar usuarios (vista de administración)
      description: |
        Lista los usuarios del sistema con filtros y paginación. Devuelve la
        vista que consume el módulo de gestión de usuarios del panel admin.

        Solo un usuario con rol `admin` puede llamar este endpoint.
      parameters:
        - in: query
          name: role
          schema:
            type: string
            enum: [client, worker, both, admin]
          description: Filtrar por rol.
        - in: query
          name: search
          schema:
            type: string
          description: Buscar por nombre o correo (subcadena, sin distinguir mayúsculas).
        - in: query
          name: status
          schema:
            type: string
            enum: [active, suspended]
          description: Filtrar por estado de la cuenta.
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Lista paginada de usuarios.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        email:
                          type: string
                        firstName:
                          type: string
                        lastName:
                          type: string
                        avatarUrl:
                          type: string
                          nullable: true
                        role:
                          type: string
                        status:
                          type: string
                          enum: [active, suspended]
                        verified:
                          type: boolean
                        phone:
                          type: string
                        rating:
                          type: number
                        ratingCount:
                          type: integer
                        completedJobs:
                          type: integer
                        createdAt:
                          type: string
                          format: date-time
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
                  totalPages:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'

  /admin/users/{uid}/role:
    patch:
      tags: [admin]
      summary: Cambiar el rol de un usuario
      description: |
        Actualiza `users/{uid}.role` y el Custom Claim `role` a un rol permitido
        (`client`, `worker` o `both`). Nota: para promover/revocar el rol `admin`
        usa `POST /admin/makeAdmin` y `POST /admin/removeAdmin`.

        Solo un usuario con rol `admin` puede llamar este endpoint. El usuario
        afectado debe refrescar su token (`getIdToken(true)`).
      parameters:
        - in: path
          name: uid
          required: true
          schema:
            type: string
          description: UID del usuario.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [client, worker, both]
                  description: Nuevo rol del usuario (no admin; eso se hace con makeAdmin/removeAdmin).
              required: [role]
      responses:
        '200':
          description: Rol actualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  role:
                    type: string
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/suspendUser:
    post:
      tags: [admin]
      summary: Suspender un usuario
      description: |
        Marca la cuenta de un usuario como `status: suspended`. Las reglas de
        Firestore deniegan las escrituras de cuentas suspendidas (ver helper
        `notSuspended()` en `firestore.rules`).

        Solo un usuario con rol `admin` puede llamar este endpoint. No se puede
        suspender a un admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                uid:
                  type: string
                  description: UID del usuario a suspender.
              required: [uid]
      responses:
        '200':
          description: Usuario suspendido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
                    example: suspended
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/activateUser:
    post:
      tags: [admin]
      summary: Reactivar un usuario suspendido
      description: |
        Devuelve la cuenta de un usuario a `status: active`, restaurando su
        capacidad de escritura en Firestore.

        Solo un usuario con rol `admin` puede llamar este endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                uid:
                  type: string
                  description: UID del usuario a reactivar.
              required: [uid]
      responses:
        '200':
          description: Usuario reactivado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
                    example: active
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/verifyWorker:
    post:
      tags: [admin]
      summary: Verificar o rechazar la verificación de un trabajador
      description: |
        Marca `verified: true/false` en el documento del trabajador. Se usa para
        el flujo de verificación de profesionales del panel admin.

        Solo un usuario con rol `admin` puede llamar este endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workerId:
                  type: string
                  description: UID del trabajador a verificar.
                approve:
                  type: boolean
                  description: true para verificar, false para rechazar.
              required: [workerId, approve]
      responses:
        '200':
          description: Estado de verificación actualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  verified:
                    type: boolean
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/jobs:
    get:
      tags: [admin]
      summary: Listar todos los trabajos (vista admin)
      description: |
        Lista los trabajos con filtros y paginación para el módulo "Todos los
        Trabajos" del panel admin.

        Solo un usuario con rol `admin` puede llamar este endpoint.
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, published, assigned, in_progress, completed, cancelled]
          description: Filtrar por estado del trabajo.
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Lista paginada de trabajos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    description: Cada trabajo usa el schema `job.json` (colección jobs).
                    items:
                      allOf:
                        - $ref: './schemas/job.json'
                      properties:
                        id:
                          type: string
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
                  totalPages:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'

  /admin/activityLog:
    get:
      tags: [admin]
      summary: Log de actividad reciente
      description: |
        Devuelve las acciones administrativas y eventos recientes de la plataforma
        (registros, trabajos, ofertas, promociones, suspensiones) para el feed de
        actividad del dashboard admin.

        Solo un usuario con rol `admin` puede llamar este endpoint.
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Eventos de actividad reciente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        userId:
                          type: string
                        userName:
                          type: string
                        action:
                          type: string
                        entityType:
                          type: string
                        entityId:
                          type: string
                        description:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
