spring:
  application:
    name: paTodo-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/patodo}
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  servlet:
    context-path: /api

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-production-min-256-bits}
    access-token-expiration: 900000      # 15 min
    refresh-token-expiration: 604800000  # 7 days
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://10.0.2.2:8080}
  websocket:
    allowed-origins: ${WS_ORIGINS:http://localhost:3000,http://localhost:5173}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    com.paTodo: DEBUG
    org.springframework.security: DEBUG
    org.springframework.data.mongodb: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"